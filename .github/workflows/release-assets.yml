name: Build and publish dex release assets

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y jq unzip zip

      - name: Verify dex-owned release chain
        run: bash tools/check-self-owned-release-chain.sh

      - name: Build release assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          test -n "$RELEASE_TAG"
          git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null
          component_dir="$RUNNER_TEMP/de_GWD-components"
          asset_dir="$RUNNER_TEMP/dex-release-assets"
          mkdir -p "$asset_dir"
          bash tools/build-de-gwd-components.sh "$component_dir"
          cmp "$component_dir/de_GWD_amd64.zip" de_GWD_amd64.zip
          cmp "$component_dir/de_GWD_arm64.zip" de_GWD_arm64.zip

          cp "$component_dir/de_GWD_amd64.zip" "$asset_dir/"
          cp "$component_dir/de_GWD_arm64.zip" "$asset_dir/"
          cp "$component_dir/component-sources.tsv" "$asset_dir/"
          cp "$component_dir/component-versions.json" "$asset_dir/"
          sha256sum "$asset_dir/de_GWD_amd64.zip" | awk '{print $1}' > "$asset_dir/de_GWD_amd64.zip.sha256sum"
          sha256sum "$asset_dir/de_GWD_arm64.zip" | awk '{print $1}' > "$asset_dir/de_GWD_arm64.zip.sha256sum"

          for file in \
            resource/client/Archive.zip \
            resource/client/Archive.zip.sha256sum \
            resource/doh/doh_s_amd64 \
            resource/doh/doh_s_amd64.sha256sum \
            resource/doh/doh_s_arm64 \
            resource/doh/doh_s_arm64.sha256sum \
            resource/nginx/nginx_amd64 \
            resource/nginx/nginx_amd64.sha256sum \
            resource/nginx/nginx_arm64 \
            resource/nginx/nginx_arm64.sha256sum \
            resource/nginx/nginxConf.zip \
            resource/nginx/nginxConf.zip.sha256sum \
            resource/server/sample.zip \
            resource/server/sample.zip.sha256sum \
            version.php; do
            cp "$file" "$asset_dir/$(basename "$file")"
          done

          {
            printf 'repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'tag=%s\n' "$RELEASE_TAG"
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'source_mode=dex-owned resources with pinned third-party component inputs\n'
          } > "$asset_dir/release-metadata.txt"

          (
            cd "$asset_dir"
            find . -maxdepth 1 -type f \
              ! -name '*.sha256sum' \
              ! -name 'release-assets.sha256sum' \
              -printf '%f\n' | sort | xargs sha256sum > release-assets.sha256sum
          )

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset_dir="$RUNNER_TEMP/dex-release-assets"
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "dex $RELEASE_TAG" \
              --generate-notes \
              --verify-tag
          fi
          gh release upload "$RELEASE_TAG" "$asset_dir"/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
